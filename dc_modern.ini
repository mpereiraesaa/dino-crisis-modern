[Stick]
Enabled=1
RunOnPercent=75
RunOffPercent=65
; XInput X/Square, whose current Classic REbirth mapping is the run action.
RunButton=0x4000

[Modern]
; 1 = the left stick moves Regina relative to the camera; the d-pad keeps
; the original tank controls. 0 = original tank controls on the stick.
Enabled=1
TurnDegreesPerSecond=720
DeadzonePercent=25
; Keep the previous camera's directions after a camera cut until the stick
; is released or swung more than 45 degrees.
HoldCameraOnCut=1


[Triggers]
; 1 = L2 aims (like R1) and R2 fires while aiming (like Cross); R2 without
; aiming stays Turn Around. 0 = the game's own trigger use.
Enabled=1
; How far a trigger is pulled before it counts.
PullPercent=30

[Buttons]
; 1 = Triangle opens the status screen (inventory, map) and Circle cancels;
; Square still cancels/runs. 0 = the game's own layout (Circle opens the
; status screen, Triangle confirms).
Enabled=1

[Doors]
; 1 = skip the door animation: straight to the fade and the next room's
; loading. 0 = the game's door animations.
Skip=1

[Camera]
; Modern = over-the-shoulder camera (RE4 style), Fixed = the game's fixed
; cameras. In game the touchpad (PS5), F12 or R3 (PC) switches it and saves
; the choice here. The modern camera draws the whole room, not only what the
; fixed camera showed, and sorts it by each polygon's depth (the game's fixed
; per-piece order is made for the fixed cameras and lets pieces behind a wall
; paint over it).
Mode=Fixed
; Camera placement in game units (Regina is about 1700 tall).
Distance=1700
Height=1850
; SideOffset moves it right of Regina (negative: left).
SideOffset=520
LookAhead=2800
LookHeight=1550
; Right stick turn speed.
TurnDegreesPerSecond=180
; 1 = the camera stops in front of walls (the room's own collision) instead
; of going through them. CollisionRadius keeps it that far from a wall.
Collision=1
CollisionRadius=200
; How much the camera rises over Regina's head when a wall pulls it in, and
; how close behind her it may come.
RiseWhenClose=500
MinDistance=550

[Display]
; 60 = smooth 60 fps: the game still runs at 30 ticks a second, and an extra
; frame between ticks shows the camera, characters and effects halfway
; between them. 30 = the original frame rate.
FrameRate=60

[Cheats]
; Set from the in-game menu (L3+R3). 1 = infinite ammo, no reloads.
InfiniteAmmo=0
